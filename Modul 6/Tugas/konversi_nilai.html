<!DOCTYPE html>
<html>
<head>
    <TITLE>Konversi Nilai Angka ke Huruf</TITLE>
    <SCRIPT language="Javascript">
    function konversiNilai() {
        var nilai = parseFloat(document.formNilai.angka.value);
        var huruf = "";

        if (isNaN(nilai)) {
            huruf = "Masukkan angka yang valid!";
        } else if (nilai >= 0 && nilai <= 40) {
            huruf = "E";
        } else if (nilai >= 41 && nilai <= 55) {
            huruf = "D";
        } else if (nilai >= 56 && nilai <= 60) {
            huruf = "C";
        } else if (nilai >= 61 && nilai <= 65) {
            huruf = "BC";
        } else if (nilai >= 66 && nilai <= 70) {
            huruf = "B";
        } else if (nilai >= 71 && nilai <= 80) {
            huruf = "AB";
        } else if (nilai >= 81 && nilai <= 100) {
            huruf = "A";
        } else {
            huruf = "Nilai di luar jangkauan (0-100)!";
        }

        document.formNilai.hasil.value = huruf;
    }
    </SCRIPT>
</head>
<body>
    <h2>Form Konversi Nilai Angka ke Huruf</h2>
    <form name="formNilai">
        <p>Masukkan Nilai Angka (0-100): <input type="text" name="angka" size="10"></p>
        <p><input type="button" value="Konversi" onclick="konversiNilai()"></p>
        <p>Nilai Huruf: <input type="text" name="hasil" size="30" readonly></p>
    </form>
</body>
</html>
