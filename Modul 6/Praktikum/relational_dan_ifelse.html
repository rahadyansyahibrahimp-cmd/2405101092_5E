<HTML>
<HEAD>
<TITLE>Contoh Program Javascript & if-else</TITLE>
</HEAD>
<SCRIPT language="Javascript">
function testRelational () {
    val1 = window.prompt("Nilai I :")
    val2 = window.prompt("Nilai II :")
    document.write("<br>"+"val1==val2"+"<br>")
    document.write(val1 == val2)
    document.write("<br>"+"val1!=val2"+"<br>")
    document.write(val1 != val2)
    document.write("<br>"+"val1>val2"+"<br>")
    document.write(val1 > val2)
    document.write("<br>"+"val1<val2"+"<br>")
    document.write(val1 < val2) 
}
</SCRIPT>
<BODY>
<!-- Tombol untuk Operasi Relasional -->
<input type="button" name="button1" value="relational" onclick="testRelational()">
<br><hr><br>

<!-- Seleksi Kondisi if-else -->

    hasil = "Lulus";
else

document.write("Hasil: " + hasil);
