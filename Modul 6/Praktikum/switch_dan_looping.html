<HTML>
<HEAD>
<TITLE>Contoh Program Switch & Looping</TITLE>
</HEAD>
<SCRIPT language="Javascript">
function testSwitch ()
{
    val1 = window.prompt("Input Nilai (1-5):")
    switch (val1)
    {
        case "1" :
            document.write("bilangan satu")
            break
        case "2" :
            document.write("bilangan dua")
            break
        case "3" :
            document.write("bilangan tiga")
            break
        case "4" :
            document.write("bilangan empat")
            break
        case "5" :
            document.write("bilangan lima")
            break
        default :
            document.write("bilangan lainnya")
    }
}
</SCRIPT>
<BODY>
<!-- Tombol Switch -->
<input type="button" name="button1" value="switch" onclick="testSwitch()">
<br><hr><br>

<!-- Looping For -->
<SCRIPT language="Javascript">

for (x = 0; x <= 10; x++)
    document.write(x + "<br>")
// -->
</SCRIPT>
</BODY>
