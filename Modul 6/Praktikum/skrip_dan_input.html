<!-- Bagian 2: Skrip JavaScript document.write -->
Percobaan memakai JavaScript:<BR>

<!-- Bagian 3: Pemasukan Data (Prompt) -->

var nama = prompt("Siapa nama Anda?","Masukkan nama anda");
document.write("<br>Hai, " + nama);
</SCRIPT>
